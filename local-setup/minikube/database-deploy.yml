apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-taskboard
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
     app: db-taskboard
  template:
    metadata:
      labels:
        app : db-taskboard
    spec:
      automountServiceAccountToken: false
      containers:
        - name: db-taskboard
          image:  postgres:17
          envFrom:
            - configMapRef:
                name: connection-db
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"