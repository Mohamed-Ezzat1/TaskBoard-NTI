name: ci by 
run-name: run number ${{github.run_number}}
on:
    push:
    workflow_dispatch:
jobs:
    prebuild:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
                persist-credentials: false
            - name: prebuild composite action 
              uses: ./.github/actions/prebuild
              with:
                sonar-token: ${{secrets.SONAR_TOKEN}}